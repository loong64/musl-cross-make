name: Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [loongarch64-linux-musl]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: |
            MUSL_TARGET=${{ matrix.target }}
          tags: ${{ github.repository }}:${{ matrix.target }}
          outputs: type=local,dest=./

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-${{ github.run_id }}
          path: ./dist/*.tgz

  release:
    needs: build
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: loongarch64-*
          path: dist
          merge-multiple: true

      - name: Generate notes
        run: |
          cat <<EOF > release_notes.md
          ### Build Configuration
          \`\`\`makefile
          $(cat config.mak)
          \`\`\`
          EOF

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="$(date +%Y%m%d)"
          gh release create "${TAG_NAME}" \
            --notes-file release_notes.md \
            --title "${TAG_NAME}" \
            dist/*